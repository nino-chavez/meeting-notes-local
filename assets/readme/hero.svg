<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">local-meeting-notes — meeting notes with no bot and no cloud</title>
  <desc id="hero-desc">A meeting notetaker that captures system audio through a Core Audio process tap and the microphone separately, so the far end and the near end arrive as two streams. The panel on the right shows both level tracks from a real capture: the microphone track carries a constant room-noise floor, the system track is silent until audio plays, and both rise together during speech.</desc>

  <rect width="1200" height="380" rx="6" fill="#0E1014"/>

  <g id="identity">
    <text x="56" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7C828D" letter-spacing="2.4">macOS 14.4+ &#183; APPLE SILICON</text>
    <text x="54" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" fill="#F5F6F7" font-weight="700">local-meeting-notes</text>
    <text x="56" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#A2A7B0">No bot joins the call. No audio leaves the Mac.</text>
    <text x="56" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#A2A7B0">The far end and your voice arrive as two separate streams.</text>

    <line x1="56" y1="252" x2="580" y2="252" stroke="#24282F" stroke-width="1"/>

    <text x="56" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F5F6F7">16 kHz</text>
    <text x="112" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C828D">s16le mono</text>
    <text x="232" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#F5F6F7">Core Audio tap</text>
    <text x="396" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C828D">no virtual driver</text>
    <text x="56" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C828D">network: none &#8212; capture, transcription and notes all stay on disk</text>
  </g>

