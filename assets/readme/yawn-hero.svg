<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Yawn — a private meeting notepad for macOS</title>
  <desc id="desc">A light, calm illustration showing Yawn's three steps: record, write what matters, and check the source transcript.</desc>

  <rect width="1200" height="500" rx="28" fill="#f7f7f4"/>
  <rect x="20" y="20" width="1160" height="460" rx="22" fill="#ffffff" stroke="#e4e4de" stroke-width="2"/>

  <text x="76" y="104" fill="#676760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">YAWN · PRIVATE MEETING NOTEPAD</text>
  <text x="76" y="198" fill="#1b1b18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-3">A quieter record.</text>
  <text x="76" y="246" fill="#676760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Stay in the conversation. Keep what matters.</text>

  <rect x="76" y="302" width="136" height="38" rx="19" fill="#edf2ff"/>
  <text x="144" y="327" text-anchor="middle" fill="#19449e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing=".8">ON THIS MAC</text>
  <rect x="224" y="302" width="145" height="38" rx="19" fill="#fff0ed"/>
  <text x="296" y="327" text-anchor="middle" fill="#a83c2e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing=".8">CONSENT FIRST</text>

  <rect x="694" y="74" width="422" height="352" rx="18" fill="#fbfbf9" stroke="#e4e4de" stroke-width="2"/>
  <circle cx="730" cy="110" r="7" fill="#d84e3c"/>
  <text x="748" y="115" fill="#1b1b18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">One clear path through a meeting</text>
  <line x1="730" y1="145" x2="1080" y2="145" stroke="#e4e4de" stroke-width="2"/>

  <rect x="730" y="178" width="104" height="170" rx="12" fill="#fff0ed"/>
  <circle cx="782" cy="218" r="15" fill="#d84e3c"/>
  <text x="782" y="269" text-anchor="middle" fill="#1b1b18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Record</text>
  <text x="782" y="294" text-anchor="middle" fill="#676760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">with consent</text>

  <path d="M850 263 H877" fill="none" stroke="#cdcdc4" stroke-width="2" stroke-linecap="round"/>
  <path d="M871 257 L878 263 L871 269" fill="none" stroke="#cdcdc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="894" y="178" width="104" height="170" rx="12" fill="#edf2ff"/>
  <path d="M925 217 H967" fill="none" stroke="#2859c5" stroke-width="5" stroke-linecap="round"/>
  <path d="M925 232 H956" fill="none" stroke="#7a9be1" stroke-width="5" stroke-linecap="round"/>
  <path d="M925 247 H945" fill="none" stroke="#b7c7ed" stroke-width="5" stroke-linecap="round"/>
  <text x="946" y="285" text-anchor="middle" fill="#1b1b18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Write</text>
  <text x="946" y="310" text-anchor="middle" fill="#676760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">what matters</text>

  <path d="M1014 263 H1041" fill="none" stroke="#cdcdc4" stroke-width="2" stroke-linecap="round"/>
  <path d="M1035 257 L1042 263 L1035 269" fill="none" stroke="#cdcdc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1058" y="178" width="104" height="170" rx="12" fill="#f7f9ff" stroke="#d8e2ff" stroke-width="2"/>
  <path d="M1085 211 H1136 V243 H1085 Z" fill="none" stroke="#426cc8" stroke-width="2" stroke-linejoin="round"/>
  <path d="M1096 254 H1125" fill="none" stroke="#7a9be1" stroke-width="4" stroke-linecap="round"/>
  <path d="M1096 267 H1118" fill="none" stroke="#b7c7ed" stroke-width="4" stroke-linecap="round"/>
  <text x="1110" y="300" text-anchor="middle" fill="#1b1b18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Check</text>
  <text x="1110" y="325" text-anchor="middle" fill="#676760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">the source</text>

  <line x1="76" y1="402" x2="1124" y2="402" stroke="#e4e4de" stroke-width="2"/>
  <text x="76" y="438" fill="#92928a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Private on your Mac · Your notes stay separate from the transcript</text>
</svg>
