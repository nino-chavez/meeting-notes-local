<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Capture architecture: two legs into one transcript</title>
  <desc id="pipe-desc">System audio is captured by a vendored Swift binary using a Core Audio process tap and piped as sixteen kilohertz PCM into the Python daemon. The microphone is captured in the same process through sounddevice. Both legs are transcribed locally by MLX Whisper. The microphone transcript then passes three filters — is there voiced audio behind this segment, is that audio the far end returning through the room, and is it the operator's own voice — before the two legs are interleaved into a transcript that either carries Me and Them labels or declares itself unattributed. Nothing leaves the machine.</desc>

  <rect width="1200" height="280" rx="6" fill="#0E1014"/>

  <text x="56" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7C828D" letter-spacing="2.4">CAPTURE ARCHITECTURE</text>

  <g>
      <rect x="56" y="74" width="232" height="76" rx="6" fill="#191C21" stroke="#24282F" stroke-width="1"/>
      <text x="74" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#F5F6F7" font-weight="600">System audio</text>
      <text x="74" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7C828D">audiotee &#183; Core Audio tap</text>
    </g>
  <g>
      <rect x="56" y="170" width="232" height="76" rx="6" fill="#191C21" stroke="#24282F" stroke-width="1"/>
      <text x="74" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#F5F6F7" font-weight="600">Microphone</text>
      <text x="74" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7C828D">sounddevice</text>
    </g>

  <line x1="288" y1="112" x2="349" y2="112" stroke="#444A54" stroke-width="1.5"/><path d="M 349 108 L 356 112 L 349 116 Z" fill="#444A54"/>
  <line x1="288" y1="208" x2="349" y2="208" stroke="#444A54" stroke-width="1.5"/><path d="M 349 204 L 356 208 L 349 212 Z" fill="#444A54"/>

  <g>
      <rect x="356" y="74" width="236" height="172" rx="6" fill="#191C21" stroke="#24282F" stroke-width="1"/>
      <text x="374" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#F5F6F7" font-weight="600">dual_capture.py</text>
      <text x="374" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7C828D">16 kHz s16le &#183; both legs</text>
    </g>
  <text x="374" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5C626D">timestamps each block on arrival</text>
  <text x="374" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5C626D">measures drift and bleed</text>
  <text x="374" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5C626D">gates: voicing, echo, voiceprint</text>

  <line x1="592" y1="160" x2="653" y2="160" stroke="#444A54" stroke-width="1.5"/><path d="M 653 156 L 660 160 L 653 164 Z" fill="#444A54"/>

  <g>
      <rect x="660" y="122" width="220" height="76" rx="6" fill="#191C21" stroke="#24282F" stroke-width="1"/>
      <text x="678" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#F5F6F7" font-weight="600">MLX Whisper</text>
      <text x="678" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7C828D">on-GPU, weights cached local</text>
    </g>

  <line x1="880" y1="160" x2="941" y2="160" stroke="#444A54" stroke-width="1.5"/><path d="M 941 156 L 948 160 L 941 164 Z" fill="#444A54"/>

  <g>
      <rect x="948" y="122" width="196" height="76" rx="6" fill="#191C21" stroke="#24282F" stroke-width="1"/>
      <text x="966" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#F5F6F7" font-weight="600">transcript.json</text>
      <text x="966" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7C828D">Me / Them, or unattributed</text>
    </g>

  <line x1="56" y1="264" x2="1144" y2="264" stroke="#24282F" stroke-width="1"/>
  <text x="56" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7C828D">the pipe between the Swift tap and the Python daemon is ordinary stdout &#8212; no IPC, no driver, no network</text>
</svg>
