schema: work-library-publication/0
case_id: local-meeting-notes
adapter: git-manifest
canonical_output: beta-boundary

catalog:
  title: Yawn
  subtitle: A private macOS meeting notepad
  question: Can one person keep a useful private meeting record without turning it into a cloud workspace?
  summary: "Yawn records a consented meeting on one Mac, preserves the operator's own notes, and keeps generated claims visibly separate from transcript evidence. It does not claim accounts, cloud sync, sharing, bots, calendar connections, or task automation."

collection_candidates: [local-ai, product-research]

publication:
  status: draft
  clearance: internal
  assurance:
    human_validation: pending

outputs:
  - id: beta-boundary
    type: decision-record
    status: draft
    artifact: docs/product-brief.md
    clearance: internal
    assurance:
      human_validation: pending
  - id: capture-evidence
    type: evidence-register
    status: ready
    artifact: spike/RESULTS.md
    clearance: internal
    assurance:
      human_validation: pending
  - id: notes-evidence
    type: evidence-register
    status: ready
    artifact: notes/EVAL.md
    clearance: internal
    assurance:
      human_validation: pending
  - id: release-reference
    type: reference-library
    status: draft
    artifact: docs/distribution-runbook.md
    clearance: internal
    assurance:
      human_validation: pending

projections:
  - id: decision
    output: beta-boundary
    artifact: docs/product-brief.md
    render_as: markdown-document
    kind: brief
    label: Product brief
    route: /
  - id: capture-evidence
    output: capture-evidence
    artifact: spike/RESULTS.md
    render_as: markdown-document
    kind: evidence
    label: Capture and voice-isolation evidence
    route: /evidence/capture
  - id: notes-evidence
    output: notes-evidence
    artifact: notes/EVAL.md
    render_as: markdown-document
    kind: evidence
    label: Note-generation evidence
    route: /evidence/notes
  - id: release-runbook
    output: release-reference
    artifact: docs/distribution-runbook.md
    render_as: markdown-document
    kind: procedure
    standing: conditional
    label: Release procedure and open human gates
    route: /guidance/release-runbook

exclude:
  - assets/**
  - capture/**
  - fixtures/**
  - sessions/**
  - tests/**
  - docs/prototype/**
  - docs/survey/**
  - "**/__pycache__/**"
  - "**/.git/**"
  - "**/.venv/**"
