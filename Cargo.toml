[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/session-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
core-foundation = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
icu_normalizer = "=2.2.0"
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["serde", "v4"] }
