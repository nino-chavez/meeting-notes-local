[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/session-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sysinfo = "0.37"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
