<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Yawn Settings</title>
    <link rel="stylesheet" href="settings-window.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header>
        <p class="eyebrow">Yawn</p>
        <h1>Settings</h1>
        <p>Only the things that affect a private recording belong here.</p>
      </header>
      <section class="privacy-card" aria-labelledby="privacy-title">
        <span aria-hidden="true">⌂</span>
        <div>
          <h2 id="privacy-title">Kept on this Mac</h2>
          <p>Yawn does not use an account, cloud sync, a meeting bot, or automatic sharing.</p>
        </div>
      </section>
      <section class="settings-card" aria-labelledby="audio-title">
        <div class="section-heading">
          <div><h2 id="audio-title">Audio access</h2><p>Yawn needs both sources before it can record a meeting.</p></div>
          <button class="quiet-button" type="button" data-action="refresh">Check again</button>
        </div>
        <div id="permissions" class="permission-list" aria-live="polite"></div>
      </section>
      <p id="message" class="message" role="status"></p>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
