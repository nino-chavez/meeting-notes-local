[package]
name = "local-meeting-notes-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Meeting Notes safety-first macOS shell"

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
libc.workspace = true
local-meeting-notes-session-core = { path = "../../../crates/session-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
library-dev-surface = []
preview-surface = []
